name: bgo
description: "Your personal board games organizer"

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  bgg_api: ^0.8.0
  bloc_concurrency: ^0.2.5
  cached_network_image: ^3.3.1
  drift: ^2.19.1
  drift_flutter: ^0.1.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_hooks: ^0.20.5
  flutter_localizations:
    sdk: flutter
  flutter_slidable: ^3.1.0
  fpdart: ^1.1.0
  go_router: ^14.2.1
  google_fonts: ^6.2.1
  path: ^1.9.0
  path_provider: ^2.1.3

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.19.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
